[project]
name = "efficient-moe"
version = "0.1.0"
description = "MoE efficiency experiments: vLLM patches, HF pruning, MMLU/HumanEval/LCB benchmarks."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate==1.13.0",
    "datasets==4.8.4",
    "human-eval==1.0.3",
    "lm-eval==0.4.11",
    "matplotlib==3.10.8",
    "numpy==2.2.6",
    "pebble>=5.1.0",
    "ray>=2.31,<3",
    "seaborn==0.13.2",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "tqdm==4.67.3",
    "transformers==4.57.6",
    "vllm==0.18.1",
]

[tool.uv]
package = false
